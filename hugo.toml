baseURL = "https://mlkwebstudio.com/"
title = "MLK Web Studio"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
timeZone = "Europe/Paris"
disableKinds = ["taxonomy", "term"]
removePathAccents = true

[params]
  email = "hello@mlkwebstudio.com"
  emailMain = "hello@mlkwebstudio.com"
  accent = "#2B4DFF"
  orange = "#EF571D"
  bookingUrl = "/contact/"
  # Floating "write to us" button on desktop (phones already have the bottom dock)
  contactBubble = true
  # Newsletter sign-ups (blog sidebar, desktop only): FormSubmit sends each one to the address set
  # per language below (newsletterAction) until a newsletter tool is chosen
  # The author of every article. Change the name here and it changes everywhere on the site
  # (the bios in languages.*.params.authorBio insert it where %s is).
  [params.author]
    name = "Joana Mehou"

# Articles: /blog/<slug>/ in English, /fr/blog/<slug>/ in French (each language has its own slug)
[permalinks.page]
  blog = "/blog/:slug/"

# "Related articles": same category and shared keywords
[related]
  includeNewer = true
  threshold = 20
  toLower = true
  [[related.indices]]
    name = "keywords"
    weight = 100
  [[related.indices]]
    name = "category"
    weight = 60

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.extras.mark]
    enable = true
  [markup.goldmark.parser.attribute]
    block = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2

# Search index of the blog (/blog/search.json, /fr/blog/search.json) and llms.txt for AI assistants
[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "search"
  isPlainText = true
  notAlternative = true
[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "LLMS"]
  section = ["HTML"]

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en-GB"
    weight = 1
    contentDir = "content/en"
    title = "MLK Web Studio"
    [languages.en.permalinks.page]
      projects = "/projects/:contentbasename/"
      services = "/services/:slug/"
      topics = "/blog/category/:slug/"
    [languages.en.permalinks.section]
      topics = "/blog/category/"
    [languages.en.params]
      email = "hello@mlkwebstudio.com"
      newsletterAction = "https://formsubmit.co/hello@mlkwebstudio.com"
      tagline = "Websites and SEO that bring in clients."
      description = "MLK Web Studio designs and builds websites, ranks them on Google, and fills calendars with cold email. Portfolio and services."
      leadhuntersUrl = "https://mlkleadhunters.com/"
      authorRole = "Web designer, SEO and cold emailing specialist"
      authorBio = "%s has been building websites since the age of eleven and founded MLK Web Studio in 2021, between London and Paris: websites, SEO, cold emailing and automation for small businesses in the UK and France, with honest advice, including when you do not need to hire anyone."
      [languages.en.params.social]
        youtube = "https://www.youtube.com/@mlkwebstudio"
        instagram = "https://www.instagram.com/mlkwebstudio/"
        tiktok = "https://www.tiktok.com/@mlkwebstudio"
        threads = "https://www.threads.com/@mlkwebstudio"
        bluesky = "https://bsky.app/profile/mlkwebstudio.bsky.social"
    [[languages.en.menus.main]]
      name = "Projects"
      pageRef = "/projects"
      weight = 10
    [[languages.en.menus.main]]
      name = "Websites"
      pageRef = "/services/websites"
      weight = 20
    [[languages.en.menus.main]]
      name = "SEO"
      pageRef = "/services/seo"
      weight = 30
    [[languages.en.menus.main]]
      name = "Cold email"
      pageRef = "/services/cold-emailing"
      weight = 40
    [[languages.en.menus.main]]
      name = "Learn"
      pageRef = "/blog"
      weight = 50

