{{- /* FAQ from front matter: faq: [{q, a}] (also sent as FAQPage structured data in head.html) */ -}}
{{- with .Params.faq -}}
<section class="faq" aria-labelledby="faq">
  <h2 class="faq__title" id="faq">{{ i18n "faq_title" }}</h2>
  <div class="faq__list">
    {{- range . }}
    <div class="faq__item">
      <h3 class="faq__q">{{ .q }}</h3>
      <div class="faq__a">{{ .a | $.RenderString }}</div>
    </div>
    {{- end }}
  </div>
</section>
{{- end -}}
