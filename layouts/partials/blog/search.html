{{- /* Search box: the index is /blog/search.json (or /fr/blog/search.json), loaded on first focus */ -}}
{{- $blog := site.GetPage "/blog" -}}
{{- with $blog.OutputFormats.Get "SearchIndex" -}}
<form class="bsearch" role="search" action="{{ $blog.RelPermalink }}" data-search="{{ .RelPermalink }}" onsubmit="return false">
  <label class="bsearch__label" for="bsearch-q">{{ i18n "search_label" }}</label>
  <div class="bsearch__field">
    <span class="bsearch__icon" aria-hidden="true">{{ partial "icon.html" "search" }}</span>
    <input id="bsearch-q" class="bsearch__input" type="search" name="q" placeholder="{{ i18n "search_placeholder" }}" autocomplete="off" spellcheck="false" aria-controls="bsearch-results" aria-describedby="bsearch-status">
    <kbd class="bsearch__kbd" aria-hidden="true">/</kbd>
  </div>
  <p class="bsearch__status" id="bsearch-status" role="status" aria-live="polite" data-empty="{{ i18n "search_empty" }}" data-one="{{ i18n "search_count" 1 }}" data-many="{{ replace (i18n "search_count" 2) "2" "#" }}"></p>
  <ol class="bsearch__results" id="bsearch-results" hidden></ol>
</form>
{{- end -}}
